######################################################################
# CHEAP-MODE LZA CONFIGURATION - Minimal cost baseline
# No Control Tower, single region, minimal logging
######################################################################
homeRegion: "{{ AcceleratorHomeRegion }}"
enabledRegions:
  - "{{ AcceleratorHomeRegion }}"
# NOTE: eu-south-2 removed because it's an opt-in region not enabled in child accounts
# To add: Enable region in each account first, then add here
# Using OrganizationAccountAccessRole since we're NOT using Control Tower
managementAccountAccessRole: OrganizationAccountAccessRole
tags:
  - key: Accelerator
    value: "{{ AcceleratorPrefix }}"
# Short retention to minimize CloudWatch Logs costs
cloudwatchLogRetentionInDays: 7
terminationProtection: false
cdkOptions:
  centralizeBuckets: true
  useManagementAccessRole: true
# Required: Cannot disable after enabling
useV2Stacks: true
# Control Tower is disabled
controlTower:
  enable: false
# Minimal logging configuration
logging:
  account: LogArchive
  cloudtrail:
    enable: true
    organizationTrail: true
    organizationTrailSettings:
      multiRegionTrail: false
      globalServiceEvents: true
      managementEvents: true
      s3DataEvents: false
      lambdaDataEvents: false
      sendToCloudWatchLogs: false
      apiErrorRateInsight: false
      apiCallRateInsight: false
  sessionManager:
    sendToCloudWatchLogs: false
    sendToS3: false
  accessLogBucket:
    lifecycleRules:
      - enabled: true
        abortIncompleteMultipartUpload: 7
        expiration: 30
        noncurrentVersionExpiration: 30
  centralLogBucket:
    lifecycleRules:
      - enabled: true
        abortIncompleteMultipartUpload: 7
        expiration: 30
        noncurrentVersionExpiration: 30
