######################################################################
# CONTROL TOWER + LZA CONFIGURATION - Fresh deployment
# Control Tower manages baseline, LZA adds customizations
######################################################################
homeRegion: "{{ AcceleratorHomeRegion }}"
enabledRegions:
  - "{{ AcceleratorHomeRegion }}"
# Using AWSControlTowerExecution role for Control Tower environments
managementAccountAccessRole: AWSControlTowerExecution
tags:
  - key: Accelerator
    value: "{{ AcceleratorPrefix }}"
# Short retention to minimize CloudWatch Logs costs
cloudwatchLogRetentionInDays: 7
terminationProtection: false
cdkOptions:
  centralizeBuckets: true
  useManagementAccessRole: true
# Required: Cannot disable after enabling
useV2Stacks: true
# Control Tower is enabled - LZA will set it up
controlTower:
  enable: true
# Minimal logging configuration
logging:
  account: LogArchive
  # CloudTrail is managed by Control Tower - disable LZA CloudTrail
  cloudtrail:
    enable: false
    organizationTrail: false
    organizationTrailSettings:
      multiRegionTrail: false
      globalServiceEvents: false
      managementEvents: false
      s3DataEvents: false
      lambdaDataEvents: false
      sendToCloudWatchLogs: false
      apiErrorRateInsight: false
      apiCallRateInsight: false
  sessionManager:
    sendToCloudWatchLogs: false
    sendToS3: false
  accessLogBucket:
    lifecycleRules:
      - enabled: true
        abortIncompleteMultipartUpload: 7
        expiration: 30
        noncurrentVersionExpiration: 30
  centralLogBucket:
    lifecycleRules:
      - enabled: true
        abortIncompleteMultipartUpload: 7
        expiration: 30
        noncurrentVersionExpiration: 30
