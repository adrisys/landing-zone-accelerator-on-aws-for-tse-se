######################################################################
# CHEAP-MODE NETWORK - Empty configuration
# No TGW, no VPCs, no NAT Gateways, no flow logs (big cost savings)
# Add networking after initial LZA deployment succeeds
######################################################################

# Delete default VPCs to maintain security posture
defaultVpc:
  delete: true
  excludeAccounts: []

# No Transit Gateway (saves ~$36/month per attachment + data transfer)
transitGateways: []

# No VPCs (no NAT Gateways = saves ~$32/month each + data transfer)
vpcs: []

# No VPC templates
vpcTemplates: []

# No central network services (no IPAM, no Network Firewall, no Route53 Resolver)
# centralNetworkServices: undefined

# No VPC flow logs (saves CloudWatch/S3 ingestion costs)
# vpcFlowLogs: undefined
