######################################################################
# CHEAP-MODE ORGANIZATION - Simple OUs, no SCPs initially
# Add SCPs after initial LZA deployment succeeds
######################################################################
enable: true
organizationalUnits:
  - name: Security
  - name: Infrastructure
  - name: Workloads
# Quarantine disabled initially to reduce complexity
quarantineNewAccounts:
  enable: false
# No SCPs in cheap-mode baseline - add them after initial deployment succeeds
serviceControlPolicies: []
taggingPolicies: []
backupPolicies: []
