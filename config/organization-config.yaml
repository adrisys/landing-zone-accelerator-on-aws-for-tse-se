######################################################################
# CONTROL TOWER + LZA ORGANIZATION
# Suspended OU contains closed accounts that LZA should ignore
######################################################################
enable: true
organizationalUnits:
  - name: Security
  - name: Infrastructure
  - name: Workloads
  - name: Suspended
    ignore: true  # Ignore suspended/closed accounts in this OU
# Quarantine disabled initially to reduce complexity
quarantineNewAccounts:
  enable: false
# No SCPs in cheap-mode baseline - add them after initial deployment succeeds
serviceControlPolicies: []
taggingPolicies: []
backupPolicies: []
