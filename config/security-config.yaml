######################################################################
# CHEAP-MODE SECURITY - Minimal configuration
# Disables expensive security services (GuardDuty, Macie, Security Hub)
# Enable these after initial LZA deployment succeeds
######################################################################

homeRegion: "{{ AcceleratorHomeRegion }}"

centralSecurityServices:
  delegatedAdminAccount: Audit

  # Keep EBS encryption (free)
  ebsDefaultVolumeEncryption:
    enable: true
    excludeRegions: []

  # Keep S3 public access block (free)
  s3PublicAccessBlock:
    enable: true
    excludeAccounts: []

  # Disable Macie (saves ~$1/GB scanned + $0.10/1000 objects)
  macie:
    enable: false
    excludeRegions: []
    policyFindingsPublishingFrequency: FIFTEEN_MINUTES
    publishSensitiveDataFindings: false

  # Disable GuardDuty (saves ~$4/million events + data analysis costs)
  guardduty:
    enable: false
    excludeRegions: []
    s3Protection:
      enable: false
      excludeRegions: []
    eksProtection:
      enable: false
      excludeRegions: []
    exportConfiguration:
      enable: false
      destinationType: S3
      exportFrequency: FIFTEEN_MINUTES

  # Disable Audit Manager
  auditManager:
    enable: false
    excludeRegions: []
    defaultReportsConfiguration:
      enable: false
      destinationType: S3

  # Disable Detective
  detective:
    enable: false
    excludeRegions: []

  # Disable Security Hub (saves ~$0.0010/check + findings costs)
  securityHub:
    enable: false
    regionAggregation: false
    excludeRegions: []
    standards: []
# Disable access analyzer (optional, can enable later)
accessAnalyzer:
  enable: false

# IAM password policy (free)
iamPasswordPolicy:
  allowUsersToChangePassword: true
  hardExpiry: false
  requireUppercaseCharacters: true
  requireLowercaseCharacters: true
  requireSymbols: true
  requireNumbers: true
  minimumPasswordLength: 14
  passwordReusePrevention: 24
  maxPasswordAge: 90

# AWS Config - minimal setup (recorder is required by LZA)
awsConfig:
  enableConfigurationRecorder: true
  enableDeliveryChannel: true
  # No aggregation (not using Control Tower)
  # No ruleSets (saves Lambda + Config rule costs)
# No CloudWatch metrics/alarms (saves costs, add later if needed)
cloudWatch:
  metricSets: []
  alarmSets: []

# Empty key management
keyManagementService:
  keySets: []
